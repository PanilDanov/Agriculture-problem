name: orbitFarm checks

on:
  push:
    branches: [frontend, main]
  pull_request:
    branches: [main, frontend]

permissions:
  contents: read

concurrency:
  group: orbitFarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify English-only project content
        run: node scripts/orbitFarm-verify-content.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run type, domain, build, and browser checks
        run: npm run verify
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbitFarm-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Build the Vercel release and publish
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_REVISION: 7d369758f03e442df4a7d61d0b21e6339a8bc430
    steps:
      - uses: actions/checkout@v5
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BACKEND_REVISION }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install release tools
        run: |
          if ! command -v bsdtar >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libarchive-tools
          fi
          npm install --global --no-audit --no-fund vercel@65.16.0
      - name: Stage frontend and FastAPI
        id: release
        shell: bash
        run: |
          npm ci
          npm run deploy:stage -- ../backend | tee "$RUNNER_TEMP/orbitfarm-release.log"
          release_dir=$(sed -n 's/^Vercel release directory: //p' "$RUNNER_TEMP/orbitfarm-release.log")
          test -f "$release_dir/dist/index.html"
          printf 'path=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"
      - name: Publish verified release
        env:
          RELEASE_DIR: ${{ steps.release.outputs.path }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_zJUC8g6TYHP6x0MnkZkfG0Wt
          VERCEL_PROJECT_ID: prj_ZutDvTPGMissMKemd3RXAErMjueA
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::warning::Vercel publishing requires the VERCEL_TOKEN Actions secret.'
            echo 'Release built. Publishing awaits the `VERCEL_TOKEN` repository secret.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd "$RELEASE_DIR"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --meta "orbitFarmFrontendSha=$GITHUB_SHA" --meta "orbitFarmBackendSha=$BACKEND_REVISION" \
            2>&1 | tee "$RUNNER_TEMP/orbitfarm-vercel.log"
          deployment=$(grep -oE 'https://orbitfarm-[a-z0-9-]+-lu1dgys-projects\.vercel\.app' "$RUNNER_TEMP/orbitfarm-vercel.log" | tail -n 1)
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            https://orbitfarm.vercel.app/health | jq -e '.status == "ok"'
          node "$GITHUB_WORKSPACE/frontend/scripts/orbitFarm-smoke-release.mjs" https://orbitfarm.vercel.app
          printf 'Published %s to https://orbitfarm.vercel.app/\n' "$deployment" >> "$GITHUB_STEP_SUMMARY"
