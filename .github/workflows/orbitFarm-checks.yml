name: orbitFarm checks

on:
  push:
    branches: [frontend, main]
  pull_request:
    branches: [main, frontend]

permissions:
  contents: read

concurrency:
  group: orbitFarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify English-only project content
        run: node scripts/orbitFarm-verify-content.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run type, domain, build, and browser checks
        run: npm run verify
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbitFarm-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
