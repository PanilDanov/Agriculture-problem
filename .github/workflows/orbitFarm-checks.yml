name: orbitFarm checks

on:
  push:
    branches: [frontend, main, 'codex/**']
  pull_request:
    branches: [main, frontend]

permissions:
  contents: read

concurrency:
  group: orbitFarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify English-only project content
        run: node scripts/orbitFarm-verify-content.mjs
      - name: Verify Container deployment tooling
        run: npm run test:deploy
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run type, domain, build, and browser checks
        run: npm run verify
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbitFarm-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Test the field API and NASA data processing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agronomy/requirements-*.txt
      - name: Install field API dependencies
        run: python -m pip install -r agronomy/requirements-api.txt
      - name: Run geometry, source, scoring, irrigation and API checks
        run: python -m unittest discover -s agronomy/tests -v

  ml:
    name: Verify the real models, data and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            yield_prediction/requirements*.txt
            yield_prediction/pyproject.toml
            agronomy/requirements-*.txt
      - name: Install native and pinned model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgomp1 libexpat1
          python -m pip install ./yield_prediction 'pytest>=7,<10' 'six>=1.16,<2'
          python -m pip install --no-deps catboost==1.2.8 xgboost==3.0.2
      - uses: actions/cache@v4
        with:
          path: yield_prediction/data/raw/sample
          key: cybench-sample-b55e691-0c84fd65f06a
      - name: Fetch and verify the pinned real CY-Bench sample
        run: |
          python yield_prediction/download_data.py sample
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('yield_prediction/data/raw/sample/sample-b55e691.zip')
          expected = '0c84fd65f06acb3c7224f3fc512de83019dd97734506a5018b253ccbdba0d4ed'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'CY-Bench sample SHA-256 mismatch'
          PY
      - name: Run all released/candidate/national model and data tests
        working-directory: yield_prediction
        run: python -m pytest -q
      - name: Exercise the real ML service through an isolated field API environment
        shell: bash
        run: |
          python -m venv .venv-api
          .venv-api/bin/python -m pip install -r agronomy/requirements-api.txt
          python -m yield_prediction.service --port 8001 > "$RUNNER_TEMP/orbitfarm-ml.log" 2>&1 &
          ml_pid=$!
          trap 'kill "$ml_pid" 2>/dev/null || true' EXIT
          .venv-api/bin/python scripts/orbitFarm-smoke-ml-stack.py --ml-url http://127.0.0.1:8001

  containers:
    name: Build and start the complete packaged application
    needs: [verify, backend, ml]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build the canonical Vercel container image
        run: docker compose build
      - name: Start and verify model readiness and the served website
        run: |
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/ready | jq -e '
            .status == "ready" and
            (.yieldService.details.regionalModels | length) == 8 and
            .yieldService.details.nationalModels.readyModels == 10 and
            .yieldService.details.provinceModels.readyModels == 20'
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/ | grep -q 'id="root"'
      - name: Verify actual NASA and all forecast families through the container
        run: node scripts/orbitFarm-smoke-release.mjs http://127.0.0.1:8000
      - name: Save container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop verification containers
        if: always()
        run: docker compose down --volumes

  deploy:
    name: Publish the verified Container Runtime application
    needs: [verify, backend, ml, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate linked project credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Configure the VERCEL_TOKEN secret.'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::Configure the VERCEL_ORG_ID repository variable.'; exit 1; }
      - name: Deploy and verify the exact preview URL
        id: preview
        run: npm run deploy:preview
      - name: Deploy and verify production
        id: production
        run: npm run deploy:production
      - name: Record verified deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
        run: |
          printf 'Verified commit: %s\nPreview: %s\nProduction: %s\n' "$GITHUB_SHA" "$PREVIEW_URL" "$PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
