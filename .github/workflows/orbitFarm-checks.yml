name: orbitFarm checks

on:
  push:
    branches: [frontend, main, 'codex/**']
  pull_request:
    branches: [main, frontend]

permissions:
  contents: read

concurrency:
  group: orbitFarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify English-only project content
        run: node scripts/orbitFarm-verify-content.mjs
      - name: Verify portable native release packaging
        run: node --test scripts/orbitFarm-rpm.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run type, domain, build, and browser checks
        run: npm run verify
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbitFarm-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Test the field API and NASA data processing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agronomy/requirements-*.txt
      - name: Install field API dependencies
        run: python -m pip install -r agronomy/requirements-api.txt
      - name: Run geometry, source, scoring, irrigation and API checks
        run: python -m unittest discover -s agronomy/tests -v

  ml:
    name: Verify the real models, data and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            yield_prediction/requirements*.txt
            yield_prediction/pyproject.toml
            agronomy/requirements-*.txt
      - name: Install native and pinned model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgomp1 libexpat1
          python -m pip install './yield_prediction[candidates]' 'pytest>=7,<10'
      - uses: actions/cache@v4
        with:
          path: yield_prediction/data/raw/sample
          key: cybench-sample-b55e691-0c84fd65f06a
      - name: Fetch and verify the pinned real CY-Bench sample
        run: |
          python yield_prediction/download_data.py sample
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('yield_prediction/data/raw/sample/sample-b55e691.zip')
          expected = '0c84fd65f06acb3c7224f3fc512de83019dd97734506a5018b253ccbdba0d4ed'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'CY-Bench sample SHA-256 mismatch'
          PY
      - name: Run all released/candidate/national model and data tests
        working-directory: yield_prediction
        run: python -m pytest -q
      - name: Exercise the real ML service through an isolated field API environment
        shell: bash
        run: |
          python -m venv .venv-api
          .venv-api/bin/python -m pip install -r agronomy/requirements-api.txt
          python -m yield_prediction.service --port 8001 > "$RUNNER_TEMP/orbitfarm-ml.log" 2>&1 &
          ml_pid=$!
          trap 'kill "$ml_pid" 2>/dev/null || true' EXIT
          .venv-api/bin/python scripts/orbitFarm-smoke-ml-stack.py --ml-url http://127.0.0.1:8001

  containers:
    name: Build and start the complete packaged application
    needs: [verify, backend, ml]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build the separate API and inference images
        run: |
          mkdir -p .runtime/regional-inputs
          docker compose build
      - name: Start and verify model readiness and the served website
        run: |
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/ready | jq -e '.status == "ready"'
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/ | grep -q 'id="root"'
      - name: Save container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop verification containers
        if: always()
        run: docker compose down --volumes

  deploy:
    name: Build the Vercel release and publish
    needs: [verify, backend, ml, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install release tools
        run: |
          npm install --global --no-audit --no-fund vercel@65.16.0
      - name: Stage frontend and FastAPI
        id: release
        shell: bash
        run: |
          npm ci
          npm run deploy:stage | tee "$RUNNER_TEMP/orbitfarm-release.log"
          release_dir=$(sed -n 's/^Vercel release directory: //p' "$RUNNER_TEMP/orbitfarm-release.log")
          test -f "$release_dir/dist/index.html"
          printf 'path=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"
      - name: Publish verified release
        env:
          RELEASE_DIR: ${{ steps.release.outputs.path }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_zJUC8g6TYHP6x0MnkZkfG0Wt
          VERCEL_PROJECT_ID: prj_ZutDvTPGMissMKemd3RXAErMjueA
          ORBITFARM_ML_URL: ${{ secrets.ORBITFARM_ML_URL }}
          ORBITFARM_ML_TOKEN: ${{ secrets.ORBITFARM_ML_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::warning::Vercel publishing requires the VERCEL_TOKEN Actions secret.'
            echo 'Release built. Publishing awaits the `VERCEL_TOKEN` repository secret.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$ORBITFARM_ML_URL" ]]; then
            echo '::warning::Publishing the complete application requires ORBITFARM_ML_URL for the deployed inference service.'
            echo 'Release built and tested. Publishing awaits the reachable ML service URL.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd "$RELEASE_DIR"
          runtime_args=(--env "ORBITFARM_ML_URL=$ORBITFARM_ML_URL")
          if [[ -n "$ORBITFARM_ML_TOKEN" ]]; then
            runtime_args+=(--env "ORBITFARM_ML_TOKEN=$ORBITFARM_ML_TOKEN")
          fi
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            "${runtime_args[@]}" \
            --meta "orbitFarmFrontendSha=$GITHUB_SHA" --meta "orbitFarmBackendSha=$GITHUB_SHA" \
            2>&1 | tee "$RUNNER_TEMP/orbitfarm-vercel.log"
          deployment=$(grep -oE 'https://orbitfarm-[a-z0-9-]+-lu1dgys-projects\.vercel\.app' "$RUNNER_TEMP/orbitfarm-vercel.log" | tail -n 1)
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            https://orbitfarm.vercel.app/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            https://orbitfarm.vercel.app/ready | jq -e '.status == "ready"'
          node "$GITHUB_WORKSPACE/scripts/orbitFarm-smoke-release.mjs" https://orbitfarm.vercel.app
          printf 'Published %s to https://orbitfarm.vercel.app/\n' "$deployment" >> "$GITHUB_STEP_SUMMARY"
