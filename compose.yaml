name: orbitfarm
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.vercel
    environment:
      PORT: "8000"
      ORBITFARM_ML_TOKEN: ${ORBITFARM_ML_TOKEN:-}
      ORBITFARM_SOURCE_TIMEOUT: ${ORBITFARM_SOURCE_TIMEOUT:-32}
    ports:
      - "127.0.0.1:${ORBITFARM_API_PORT:-8000}:8000"
    restart: unless-stopped
